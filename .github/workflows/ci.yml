name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ruff 是**一份**答案，跟 Python 版本無關 —— 所以它自己一個 job，不跟著
  # 下面那個 3×矩陣跑三次。它也不依賴 numpy/Qt，所以幾秒就有結果：
  # 一個打錯的名字不必等七分鐘的測試才被講出來。
  #
  # ⚠ **版本要釘住。** ruff 每一版都會多幾條規則，浮動版本的意思是
  # 「某天早上 CI 自己紅了，而沒有人改過任何一行」。要升級就改這一行，
  # 那一次的 diff 就是「新規則抓到什麼」。
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.15.8
      # 掃哪些路徑、開哪些規則、為什麼不開 E501/UP —— 全部在 pyproject.toml 的
      # `[tool.ruff]` 那一段，這裡刻意不重複一份（會漂）。
      - run: ruff check --output-format=github

  # pyright（basic）只掃 d4t/core，錯誤數不准超過 tools/typecheck.py 的上限。
  # 跟 lint 一樣是一份答案、自己一個 job；它要 numpy/cv2 的 stub 才認得型別，
  # 所以裝執行時相依（不裝 Qt —— 只掃 core）。
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy opencv-python-headless tifffile openpyxl pyright==1.1.408
      - run: python tools/typecheck.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system deps for Qt (offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
                                  libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
                                  libxcb-shape0 libxcb-xinerama0

      - name: Install Python deps
        # 這一行是 requirements.txt 的鏡像，只換一個東西：opencv-python ->
        # opencv-python-headless（runner 上沒有顯示裝置）。**加相依套件時兩邊都要改** ——
        # 下面那一步會擋住漏掉的情況。
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless tifffile PySide6 openpyxl pytest

      - name: Check the install list still covers requirements.txt
        # openpyxl 曾經漏在這裡：requirements.txt 有、CI 沒有，於是 Excel 匯出
        # 的測試在 CI 上失敗而本機全綠。與其靠人記得，不如讓 CI 自己發現。
        run: |
          python - <<'EOF'
          import re, sys, importlib.util
          names = []
          for line in open("requirements.txt", encoding="utf-8"):
              line = line.strip()
              if line and not line.startswith("#"):
                  names.append(re.split(r"[<>=!~\[]", line, 1)[0].strip())
          # 匯入名稱與套件名不一樣的例外
          IMPORT_NAME = {"opencv-python": "cv2", "PySide6": "PySide6"}
          missing = [n for n in names
                     if importlib.util.find_spec(IMPORT_NAME.get(n, n)) is None]
          if missing:
              sys.exit("requirements.txt lists %s but CI did not install them; "
                       "add them to the 'Install Python deps' step." % missing)
          print("all of requirements.txt is importable:", names)
          EOF

      # ⚠ **不要把整套塞進一個 pytest 行程。** `AGENTS.md` §5 寫著原因：UI 測試
      # 在單一行程裡跑整套會累積 Qt 記憶體，然後變得極慢。這一步以前就是
      # `pytest -q`，實測 **1:39:09**（2026-08-24 的 run 220，三個 job 各一次）
      # —— 而同一套測試分兩批跑是 **7 分鐘**。CI 因此慢了十幾倍，而且慢到
      # 沒有人想看它為什麼紅。
      #
      # 兩批加起來 = 全部（核心批 + UI 逐檔），跟 `pytest --collect-only` 的
      # 總數逐項相符 —— **這裡刻意不寫死條數**：它每一輪都在長，而寫死的那個
      # 數字沒有人守，只會變成一句過期的話。
      - name: Run tests (core)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --ignore-glob="*test_ui_*"

      - name: Run tests (UI, one process per file)
        # UI 那一批只在 3.11 跑（2026-09-09）。三個版本各跑一輪逐檔 UI 測試，
        # 而它們問的是同一件事：Qt 畫得對不對，跟 Python 版本無關。
        # 3.9 / 3.12 要守的是語法與 stdlib 相容性，核心批 + `test_py39_syntax`
        # 那條 `ast.parse(feature_version=(3, 9))` 就是在守那個。
        if: matrix.python-version == '3.11'
        env:
          QT_QPA_PLATFORM: offscreen
        # 一個檔案一個行程 —— 跟 `AGENTS.md` §5 給開發者的做法一模一樣。
        # `|| fail=1` 而不是讓它當場中斷：一次跑完看到全部紅的檔案，
        # 比修一個、推一次、再等一輪快得多。
        run: |
          fail=0
          for f in tests/test_ui_*.py; do
            echo "::group::$f"
            python -m pytest -q "$f" || fail=1
            echo "::endgroup::"
          done
          exit $fail
